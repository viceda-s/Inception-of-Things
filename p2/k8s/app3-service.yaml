apiVersion: v1               # Service is a core resource, like Namespace
kind: Service
metadata:
  name: app3-service
  namespace: apps            # same namespace as the Deployment
  labels:
    app.kubernetes.io/name: app3
    app.kubernetes.io/part-of: p2
spec:
  type: ClusterIP             # internal-only virtual IP; Ingress will front it later
  selector:
    app: app3                 # must match the Deployment's pod template label exactly
  ports:
    - port: 80                 # port the Service itself exposes internally
      targetPort: 5678         # forwards to the container's actual listening port
