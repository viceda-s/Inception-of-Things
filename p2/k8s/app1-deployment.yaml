apiVersion: apps/v1        # Deployment lives in the apps/v1 API group (workload resources)
kind: Deployment
metadata:
  name: app1-deployment
  namespace: apps           # created in Issue #3 — keeps all Part 2 resources together
  labels:
    app.kubernetes.io/name: app1
    app.kubernetes.io/part-of: p2
spec:
  replicas: 1               # app1 only needs 1 pod (app2 will use 3 in the next issue)
  selector:
    matchLabels:
      app: app1              # tells the Deployment which pods it "owns" — must match template labels below
  template:                  # the blueprint used to create each Pod
    metadata:
      labels:
        app: app1             # actual label applied to pods — the Service will select on this
    spec:
      containers:
        - name: app1
          image: hashicorp/http-echo
          args:
            - "-text=Hello from App1"   # the fixed response text this "app" returns
          ports:
            - containerPort: 5678       # http-echo listens on 5678 by default
