apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
  namespace: apps            # same namespace as the three app Services
  labels:
    app.kubernetes.io/part-of: p2
spec:
  ingressClassName: traefik   # Traefik is K3s's bundled default controller
  # No host rule matches here, so this is where every non-app1/app2 Host header lands.
  defaultBackend:
    service:
      name: app3-service
      port:
        number: 80
  rules:
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1-service
                port:
                  number: 80
    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2-service
                port:
                  number: 80
