apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
  namespace: apps            # same namespace as the three app Services
  labels:
    app.kubernetes.io/part-of: p2
spec:
  ingressClassName: traefik   # Traefik is K3s's bundled default controller
  # spec.defaultBackend is unreliable with K3s's bundled Traefik for
  # host-based Ingress (see https://github.com/traefik/traefik/issues/6082);
  # a host-less catch-all rule works reliably instead, so app3 gets one below.
  rules:
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1-service
                port:
                  number: 80
    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2-service
                port:
                  number: 80
    - http:                    # no host: matches any Host header not matched above
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app3-service
                port:
                  number: 80
